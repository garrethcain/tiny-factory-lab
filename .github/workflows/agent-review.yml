name: Agent review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name ==
      github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: zai-coding-plan/glm-5.3-flash
          use_github_token: true
          share: false
          prompt: |
            Review this pull request against its linked GitHub issue.

            Check, in order:
            1. AGENTS.md compliance: scope, no forbidden file changes,
               no unrelated refactors.
            2. Whether every acceptance criterion in the issue is
               implemented and covered by tests.
            3. Correctness bugs, security issues, and test gaps.
            4. Architecture rules in docs/ARCHITECTURE.md, especially
               no business logic in routes.

            Post your findings as a single comment with this exact shape:

            ## Agent review

            <one-sentence summary>

            | Severity | Location | Issue | Recommendation |
            | --- | --- | --- | --- |
            | high | path/to/file.py:42 | why it matters | concrete fix |

            (omit the table if there are no findings; instead write
            "No findings.")

            <details>
            <summary>Structured output</summary>

            ```json
            {
              "summary": "one sentence",
              "findings": [
                {
                  "severity": "high|medium|low",
                  "file": "path/from/repo/root",
                  "line": 0,
                  "reason": "why it matters",
                  "recommendation": "concrete fix"
                }
              ],
              "checks": {
                "acceptance_criteria": "pass|partial|fail",
                "agents_md_scope": "pass|fail",
                "tests": "pass|fail"
              }
            }
            ```

            </details>

            The JSON object must exactly match the markdown summary above.
            Do not approve, request changes, merge, or modify any code.
