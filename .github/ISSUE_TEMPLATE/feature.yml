name: Feature
description: A small, implementable change
title: "[Feature]: "
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem exists?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One observable outcome per line.
      placeholder: |
        - POST /api/readings/ accepts a valid payload and returns 201.
        - Invalid temperatures return 400.
        - A reading is retrievable by device ID.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      placeholder: |
        - No new runtime dependencies.
        - SQLite only.
        - Do not add authentication.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Required validation
      placeholder: |
        - make check (ruff check, ruff format --check, mypy src, pytest)
    validations:
      required: true
